<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lectures</title>
<style>
:root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #555; --line: #ccc; }
@media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #aaa; --line: #444; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 1.0625rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1rem; }
h1 { margin: 0 0 1.5rem; font-size: 1.75rem; }
ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
li { border-bottom: 1px solid var(--line); }
a { display: block; padding: 1rem 0; color: inherit; text-decoration: none; }
a:hover strong, a:focus-visible strong { text-decoration: underline; }
strong { display: block; }
span { color: var(--muted); font-size: .9375rem; }
</style>
</head>
<body>
<main>
<h1>Lectures</h1>
<ul>
<li><a href="cellular-changes/"><strong>Cellular changes</strong><span>Lecture 1, Pathophysiology</span></a></li>
</ul>
</main>
</body>
</html>
